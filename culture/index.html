s:1fr 2fr;gap:30px;padding:100px 4.5vw 95px}.section-intro .tag{color:#777}.section-intro h2{font-size:clamp(29px,4vw,52px);line-height:1.4;margin:0 0 24px;font-weight:400;letter-spacing:-.04em}.section-intro p{font-size:14px;line-height:2.2;color:#565c5d;max-width:610px}.archive{margin:0 4.5vw;padding-top:70px}.archive-head{display:flex;justify-content:space-between;align-items:end;gap:25px;padding-bottom:20px;border-bottom:1px solid #292a2a}.archive-head h2{font-size:30px;margin:0}.archive-head small{color:#555758;display:block;margin-top:10px}.filters{display:flex;gap:20px;flex-wrap:wrap}.filters button{border:0;border-bottom:1px solid transparent;padding:5px 0;background:none;color:#777;font-size:13px}.filters button[aria-pressed=true]{color:#171a1b;border-color:#171a1b}.group-label{display:flex;justify-content:space-between;padding:30px 0 25px;color:#565858;border-bottom:1px solid #a1a2a0}.group-label strong{font-size:15px;color:#232627}.works{display:grid;grid-template-columns:repeat(12,1fr);gap:38px 32px;padding:54px 0 110px}.work{border:0;border-top:1px solid #444;background:none;text-align:left;padding:10px 0 0;grid-column:span 4;color:inherit}.work:nth-child(1){grid-column:span 7}.work:nth-child(2){grid-column:span 5;margin-top:85px}.work:nth-child(3){grid-column:3/span 5;margin-top:30px}.work-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.work-title{font-size:clamp(19px,2vw,27px);font-weight:700}.work-meta{font-size:12px;color:#555758;white-space:nowrap}.work-english{font-size:14px;color:#555c5e;margin-top:6px}.image-stack{position:relative;margin-top:24px;height:clamp(210px,27vw,370px);overflow:hidden}.work:nth-child(2) .image-stack{height:clamp(190px,20vw,285px)}.work:nth-child(3) .image-stack{height:clamp(220px,23vw,320px)}.image-stack:before{content:'';position:absolute;top:0;left:14%;width:75%;height:76%;border:1px solid #555}.image-stack:after{content:'';position:absolute;top:0;left:14%;width:45px;height:1px;background:#555;transform:rotate(45deg);transform-origin:left}.image-stack img{position:absolute;left:0;top:12%;width:80%;height:78%;object-fit:contain;object-position:left center;filter:none;transition:transform .35s,filter .35s}.image-stack img.back{left:5%;top:17%;filter:grayscale(1);opacity:.14}.work:hover .front{transform:translate(7px,-5px)}.work:hover .back{transform:translate(-5px,4px)}.work-note{border-top:1px solid #aaa;padding-top:12px;font-size:13px;line-height:1.8;display:flex;justify-content:space-between;gap:15px;color:#333}.work-note span:last-child{font-size:20px}.empty{padding:70px 0 140px;color:#646b6b}.next{margin:0 4.5vw;border-top:1px solid #333;padding:55px 0 110px;display:grid;grid-template-columns:1fr 2fr}.next h2{font-size:clamp(30px,4.2vw,56px);font-weight:400;letter-spacing:-.04em;line-height:1.4;margin:0}.next p{font-size:13px;line-height:2;color:#686e6f}.footer{margin:0 4.5vw;padding:25px 0 35px;border-top:1px solid #999;display:flex;justify-content:space-between;font-size:11px;color:#666}.dialog{padding:0;border:1px solid #333;background:#fff;color:#222;width:min(850px,92vw);max-height:90vh}.dialog::backdrop{background:#111a}.dialog-grid{display:grid;grid-template-columns:48% 52%}.dialog img{width:100%;height:480px;object-fit:cover}.dialog-copy{padding:40px;position:relative}.dialog-copy h2{font-size:31px;margin:50px 0 5px}.dialog-copy p{font-size:13px;line-height:2;color:#596060}.dialog-copy blockquote{margin:35px 0 0;border-top:1px solid #999;padding-top:25px;font-size:16px;line-height:1.8}.close{position:absolute;right:20px;top:12px;border:0;background:none;font-size:26px}.hidden{display:none!important}@media(max-width:700px){header{min-height:64px}.header-right span{display:none}.hero{padding-top:35px}.hero h1{font-size:30px;margin-top:24px}.hero-stage{gap:10px;min-height:250px;margin-top:35px}.stage-object{width:100%;height:180px;margin-left:0}.stage-object:nth-child(2){margin-top:36px}.stage-object span{font-size:9px}.stage-label{bottom:0;font-size:9px}.section-intro{display:block;padding:70px 4.5vw}.section-intro h2{margin-top:22px}.archive-head{display:block}.filters{margin-top:25px}.works{display:block;padding:30px 0 60px}.work,.work:nth-child(2),.work:nth-child(3){display:block;width:100%;margin:0 0 48px}.image-stack,.work:nth-child(2) .image-stack,.work:nth-child(3) .image-stack{height:250px}.next{display:block;padding-bottom:65px}.next h2{margin-top:20px}.footer{gap:20px}.dialog-grid{grid-template-columns:1fr}.dialog img{height:190px}.dialog-copy{padding:25px}.dialog-copy h2{margin:20px 0 5px}.dialog-copy blockquote{margin-top:20px}}
</style></head><body><header><a class="brand" href="/">Xianning</a><div class="header-right"><span class="mono">A PERSONAL ARCHIVE OF STORIES</span><a href="#archive">浏览记录 ↓</a></div></header><main><section class="hero"><div class="hero-top mono"><span>BOOKS / FILMS / SERIES</span><span>AN ARCHIVE IN PROGRESS</span></div><h1>书影音</h1></section><section class="archive" id="archive"><div class="archive-head"><div><h2>翻阅记录</h2><small>书、电影和剧集的个人记录</small></div><div class="filters" aria-label="按类型浏览"><button data-filter="all" aria-pressed="true">全部 03</button><button data-filter="剧集" aria-pressed="false">剧集 03</button><button data-filter="电影" aria-pressed="false">电影 —</button><button data-filter="书籍" aria-pressed="false">书籍 —</button></div></div><div class="group-label"><strong>时间待确认</strong><span class="mono">UNDATED / 时间待补充</span></div><div class="works" id="works"></div><div id="empty" class="empty hidden">这个分类还没有确认过的记录。</div></section></main><footer class="footer"><span>故事经过 / 我的书影音记录</span><span>PERSONAL ARCHIVE · 2026</span></footer><dialog class="dialog" id="dialog"><div class="dialog-grid"><img id="dialog-image" alt=""><div class="dialog-copy"><button class="close" aria-label="关闭详情">×</button><div class="mono" id="dialog-status"></div><h2 id="dialog-title"></h2><p id="dialog-english"></p></div></div></dialog><script>
const items=[{title:'海豹突击队',english:'SEAL Team',kind:'剧集',status:'已看完',image:'assets/seal.jpg'},{title:'美国谍梦',english:'The Americans',kind:'剧集',status:'看过',image:'assets/americans.jpg'},{title:'黎明之前',english:'Before the Dawn',kind:'剧集',status:'进度待更新',image:'assets/dawn.svg'}];const works=document.querySelector('#works'),dialog=document.querySelector('#dialog');function render(filter='all'){works.innerHTML='';const list=items.filter(x=>filter==='all'||x.kind===filter);document.querySelector('#empty').classList.toggle('hidden',list.length>0);works.classList.toggle('hidden',!list.length);list.forEach(x=>{let b=document.createElement('button');b.className='work';b.setAttribute('aria-label',`查看${x.title}，${x.status}`);b.innerHTML=`<div class="work-top"><span class="work-title">${x.title}</span><span class="work-meta">${x.kind} / ${x.status}</span></div><div class="work-english">${x.english}</div><div class="image-stack"><img class="back" src="${x.image}" alt=""><img class="front" src="${x.image}" alt=""></div><div class="work-note"><span>观看时间待补充</span><span>↗</span></div>`;b.onclick=()=>{document.querySelector('#dialog-image').src=x.image;document.querySelector('#dialog-image').alt=x.title+'封面';document.querySelector('#dialog-title').textContent=x.title;document.querySelector('#dialog-english').textContent=x.english;document.querySelector('#dialog-status').textContent=x.kind+' / '+x.status+' / 时间待补充';dialog.showModal()};works.append(b)})}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render(b.dataset.filter)});document.querySelector('.close').onclick=()=>dialog.close();dialog.onclick=e=>{if(e.target===dialog)dialog.close()};render();
</script></body></html>
