:#555;transform:rotate(45deg);transform-origin:left}.image-stack img{position:absolute;left:0;top:12%;width:80%;height:78%;object-fit:contain;object-position:left center;filter:none;transition:transform .35s,filter .35s}.image-stack img.back{left:5%;top:17%;filter:grayscale(1);opacity:.14}.work:hover .front{transform:translate(7px,-5px)}.work:hover .back{transform:translate(-5px,4px)}.work-note{border-top:1px solid #aaa;padding-top:12px;font-size:13px;line-height:1.8;display:flex;justify-content:space-between;gap:15px;color:#333}.work-note span:last-child{font-size:20px}.empty{padding:70px 0 140px;color:#646b6b}.next{margin:0 4.5vw;border-top:1px solid #333;padding:55px 0 110px;display:grid;grid-template-columns:1fr 2fr}.next h2{font-size:clamp(30px,4.2vw,56px);font-weight:400;letter-spacing:-.04em;line-height:1.4;margin:0}.next p{font-size:13px;line-height:2;color:#686e6f}.footer{margin:0 4.5vw;padding:25px 0 35px;border-top:1px solid #999;display:flex;justify-content:space-between;font-size:11px;color:#666}.dialog{padding:0;border:1px solid #333;background:#fff;color:#222;width:min(850px,92vw);max-height:90vh}.dialog::backdrop{background:#111a}.dialog-grid{display:grid;grid-template-columns:48% 52%}.dialog img{width:100%;height:480px;object-fit:cover}.dialog-copy{padding:40px;position:relative}.dialog-copy h2{font-size:31px;margin:50px 0 5px}.dialog-copy p{font-size:13px;line-height:2;color:#596060}.dialog-copy blockquote{margin:35px 0 0;border-top:1px solid #999;padding-top:25px;font-size:16px;line-height:1.8}.close{position:absolute;right:20px;top:12px;border:0;background:none;font-size:26px}.hidden{display:none!important}@media(max-width:700px){header{min-height:64px}.header-right span{display:none}.hero{padding-top:35px}.hero h1{font-size:30px;margin-top:24px}.hero-stage{gap:10px;min-height:250px;margin-top:35px}.stage-object{width:100%;height:180px;margin-left:0}.stage-object:nth-child(2){margin-top:36px}.stage-object span{font-size:9px}.stage-label{bottom:0;font-size:9px}.section-intro{display:block;padding:70px 4.5vw}.section-intro h2{margin-top:22px}.archive-head{display:block}.filters{margin-top:25px}.works{display:block;padding:30px 0 60px}.work,.work:nth-child(2),.work:nth-child(3){display:block;width:100%;margin:0 0 48px}.image-stack,.work:nth-child(2) .image-stack,.work:nth-child(3) .image-stack{height:250px}.next{display:block;padding-bottom:65px}.next h2{margin-top:20px}.footer{gap:20px}.dialog-grid{grid-template-columns:1fr}.dialog img{height:190px}.dialog-copy{padding:25px}.dialog-copy h2{margin:20px 0 5px}.dialog-copy blockquote{margin-top:20px}}

:250px;padding:20px}.dialog .dialog-poster img{height:240px;max-height:37vh}.dialog-copy{padding:22px 25px 28px}.dialog-copy h2{margin-top:12px}.season-strip button{flex-basis:56px}.season-strip button img{width:56px;height:84px}}@media(prefers-reduced-motion:reduce){.image-stack img,.season-strip button img{transition:none!important}}
.season-link[hidden]{display:none}.season-link+.season-link{margin-left:16px}
</style></head><body><header><a class="brand" href="/">Xianning</a><div class="header-right"><span class="mono">A PERSONAL ARCHIVE OF STORIES</span><a href="#archive">浏览记录 ↓</a></div></header><main><section class="hero"><div class="hero-top mono"><span>BOOKS / FILMS / SERIES</span><span>AN ARCHIVE IN PROGRESS</span></div><h1>书影音</h1></section><section class="archive" id="archive"><div class="archive-head"><div><h2>翻阅记录</h2><small>书、电影和剧集的个人记录</small></div><div class="filters" aria-label="按类型浏览"><button data-filter="all" aria-pressed="true">全部</button><button data-filter="剧集" aria-pressed="false">剧集</button><button data-filter="电影" aria-pressed="false">电影</button><button data-filter="书籍" aria-pressed="false">书籍</button></div></div><div class="group-label"><strong>全部</strong><span class="mono">ARCHIVE / 全部记录</span></div><div class="works" id="works"></div><div id="empty" class="empty hidden">这个分类还没有确认过的记录。</div></section></main><footer class="footer"><span>故事经过 / 我的书影音记录</span><span>PERSONAL ARCHIVE · 2026</span></footer><dialog class="dialog" id="dialog"><div class="dialog-grid"><div class="dialog-poster"><img id="dialog-image" alt=""></div><div class="dialog-copy"><button class="close" aria-label="关闭详情">×</button><div class="mono" id="dialog-status"></div><h2 id="dialog-title"></h2><p id="dialog-english"></p><div id="season-ui" hidden><div class="season-caption">SEASONS / 全部剧季</div><div id="season-strip" class="season-strip" aria-label="选择剧季"></div><div class="season-controls"><button id="season-prev" aria-label="上一季">←</button><span id="season-label" aria-live="polite"></span><button id="season-next" aria-label="下一季">→</button></div></div><a id="dialog-douban" class="season-link" href="#" target="_blank" rel="noopener noreferrer">豆瓣 ↗</a> <a id="dialog-publisher" class="season-link" href="#" target="_blank" rel="noopener noreferrer" hidden>出版社 ↗</a></div></div></dialog><script>
const items=[{title:'海豹突击队',english:'SEAL Team',kind:'剧集',status:'已看完',years:'2021、2025、2026 年',image:'assets/seal.jpg',seasons:[['26992364',2017],['30181083',2018],['33441955',2019],['35060150',2020],['35467045',2021],['35760435',2022],['36217794',2024]].map(([id,year],i)=>({image:`assets/seal-s${i+1}.jpg`,douban:`https://movie.douban.com/subject/${id}/`,year}))},{title:'美国谍梦',english:'The Americans',kind:'剧集',status:'已看完',years:'2026 年',image:'assets/americans.jpg',seasons:[['10539218',2013],['21963412',2014],['25870571',2015],['26359190',2016],['26710423',2017],['26802955',2018]].map(([id,year],i)=>({image:`assets/americans-s${i+1}.jpg`,douban:`https://movie.douban.com/subject/${id}/`,year}))},{title:'黎明之前',douban:'https://movie.douban.com/subject/4894070/',english:'Before the Dawn',kind:'剧集',status:'已看完',years:'2026 年',image:'assets/dawn.jpg?v=1'},{title:'交锋',douban:'https://movie.douban.com/subject/36314809/',english:'',kind:'剧集',status:'看过',years:'2026 年',image:'assets/jiaofeng.jpg?v=1'},{title:'悬崖',douban:'https://movie.douban.com/subject/6965622/',english:'',kind:'剧集',status:'正在看',years:'',image:'assets/xuanya.jpg?v=1'}];
items.push(...[
  ["The Art of Doing Science and Engineering", "Richard W. Hamming", "assets/book-the-art-of-doing-science-and-engineering.webp", "https://stripe.press/book/the-art-of-doing-science-and-engineering", "35084167"],
  ["Boom: Bubbles and the End of Stagnation", "Byrne Hobart、Tobias Huber", "assets/book-boom.webp", "https://stripe.press/book/boom", "37112311"],
  ["Ignition!", "John D. Clark", "assets/book-ignition.webp", "https://www.rutgersuniversitypress.org/ignition/9780813599182", "30148524"],
  ["Stubborn Attachments", "Tyler Cowen", "assets/book-stubborn-attachments.webp", "https://stripe.press/book/stubborn-attachments", "30326165"],
  ["The Fountainhead", "Ayn Rand", "assets/book-the-fountainhead.webp", "https://www.penguin.co.uk/books/57532/the-fountainhead-by-ayn-rand/9780141188621", "3547615"],
  ["The Soul of a New Machine", "Tracy Kidder", "assets/book-the-soul-of-a-new-machine.webp", "https://www.hachettebookgroup.com/titles/tracy-kidder/the-soul-of-a-new-machine/9780316491976/", "1874018"],
  ["Where Is My Flying Car?", "J. Storrs Hall", "assets/book-where-is-my-flying-car.webp", "https://stripe.press/book/where-is-my-flying-car", "35618142"],
  ["The Dream Machine", "M. Mitchell Waldrop", "assets/book-the-dream-machine.webp", "https://stripe.press/book/the-dream-machine", "35247435"],
  ["The Big Score", "Michael S. Malone", "assets/book-the-big-score.webp", "https://stripe.press/book/the-big-score", "35546906"],
  ["The Origins of Efficiency", "Brian Potter", "assets/book-the-origins-of-efficiency.webp", "https://stripe.press/book/the-origins-of-efficiency", "37487123"]
].map(([title,english,image,publisher,id])=>({title,english,image,publisher,douban:`https://book.douban.com/subject/${id}/`,kind:"书籍",status:"想读"})));
const works=document.querySelector('#works'),dialog=document.querySelector('#dialog'),strip=document.querySelector('#season-strip');let current=null,season=0;
function chooseSeason(i){if(!current?.seasons||i<0||i>=current.seasons.length)return;season=i;let data=current.seasons[i];document.querySelector('#dialog-image').src=data.image;document.querySelector('#dialog-image').alt=`${current.title}第 ${i+1} 季海报`;document.querySelector('#dialog-douban').href=data.douban;document.querySelector('#dialog-douban').textContent=`第 ${i+1} 季 · 豆瓣 ↗`;document.querySelector('#season-label').textContent=`第 ${i+1} 季 / ${current.seasons.length}　·　${data.year}`;document.querySelector('#season-prev').disabled=i===0;document.querySelector('#season-next').disabled=i===current.seasons.length-1;strip.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-pressed',String(j===i)));strip.children[i]?.scrollIntoView({block:'nearest',inline:'nearest'});}
function openItem(x){current=x;season=0;const publisher=document.querySelector('#dialog-publisher');publisher.hidden=!x.publisher;if(x.publisher)publisher.href=x.publisher;else publisher.removeAttribute('href');document.querySelector('#dialog-title').textContent=x.title;document.querySelector('#dialog-english').textContent=x.english;document.querySelector('#dialog-status').textContent=[x.kind,x.status,x.years].filter(Boolean).join(' / ');strip.replaceChildren();document.querySelector('#season-ui').hidden=!x.seasons;if(x.seasons){x.seasons.forEach((v,i)=>{let b=document.createElement('button');b.type='button';b.setAttribute('aria-label',`查看第 ${i+1} 季`);b.innerHTML=`<img src="${v.image}" alt=""><span>第 ${i+1} 季</span>`;b.onclick=()=>chooseSeason(i);strip.append(b)});chooseSeason(0)}else{document.querySelector('#dialog-image').src=x.image;document.querySelector('#dialog-image').alt=x.title+(x.publisher?'封面':'海报');document.querySelector('#dialog-douban').href=x.douban;document.querySelector('#dialog-douban').textContent='豆瓣 ↗'}dialog.showModal()}
const groupLabels={all:['全部','ARCHIVE / 全部记录'],剧集:['剧集','SERIES / 观看记录'],电影:['电影','FILMS / 观看记录'],书籍:['书籍','BOOKS / 阅读记录']};
function render(filter='all'){const [label,note]=groupLabels[filter];document.querySelector('.group-label strong').textContent=label;document.querySelector('.group-label span').textContent=note;works.innerHTML='';const list=items.filter(x=>filter==='all'||x.kind===filter);document.querySelector('#empty').classList.toggle('hidden',list.length>0);works.classList.toggle('hidden',!list.length);list.forEach(x=>{let b=document.createElement('button');b.className='work'+(x.seasons?' has-seasons':'');b.setAttribute('aria-label',`查看${x.title}，${x.status}`);let cover=x.seasons?x.seasons[0].image:x.image;let second=x.seasons?x.seasons[1].image:x.image;let third=x.seasons?`<img class="third" src="${x.seasons[2].image}" alt="">`:'';b.innerHTML=`<div class="work-top"><span class="work-title">${x.title}</span><span class="work-meta">${x.kind} / ${x.status}</span></div><div class="work-english">${x.english}${x.seasons?` <span class="season-count">· ${x.seasons.length} 季</span>`:''}</div><div class="image-stack">${third}<img class="back" src="${second}" alt=""><img class="front" src="${cover}" alt=""></div><div class="work-note"><span>${x.publisher?'':(x.years||'观看时间未记录')}</span><span>↗</span></div>`;b.onclick=()=>openItem(x);works.append(b)})}
const filters=document.querySelectorAll('[data-filter]');
filters.forEach(b=>{const value=b.dataset.filter;const count=value==='all'?items.length:items.filter(x=>x.kind===value).length;b.textContent+=` ${count?String(count).padStart(2,'0'):'—'}`;b.onclick=()=>{filters.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render(value)}});document.querySelector('#season-prev').onclick=()=>chooseSeason(season-1);document.querySelector('#season-next').onclick=()=>chooseSeason(season+1);document.querySelector('.close').onclick=()=>dialog.close();dialog.onclick=e=>{if(e.target===dialog)dialog.close()};dialog.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();chooseSeason(season+1)}else if(e.key==='ArrowLeft'){e.preventDefault();chooseSeason(season-1)}});render();
</script></body></html>
