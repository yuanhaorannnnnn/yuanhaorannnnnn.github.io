<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>沟通是一个闭环 | Xianning</title><link rel="stylesheet" href="/css/style.css"><style>.quick-note{max-width:720px;margin:100px auto;padding:0 24px}.quick-note h1{font-size:2em;line-height:1.4}.quick-note time{color:#888;font-size:14px}.quick-note .post-content{margin-top:35px;line-height:1.9;overflow-wrap:anywhere}.quick-nav{display:flex;justify-content:space-between;padding:24px 40px;font-size:15px}@media(max-width:600px){.quick-nav{padding:23px 22px}.quick-note{margin:65px auto}}</style></head><body><!-- generated:quick-note --><header class="quick-nav"><a href="/">Xianning</a><a href="/archives/">文章</a></header><main class="quick-note"><h1>沟通是一个闭环</h1><time datetime="2026-10-19">2026-10-19</time><div class="post-content"><p>沟通</p><p>沟通是closed loop而不是open loop</p>
<p>沟通不只是张嘴说话，针对某一件事情和特定的人开启和沟通， 无论是线上或者线下， 比如说打一次电话或者发一条信息。或者是见面， 我们一定是有目的。所以沟通只是这个行动发起的形式， 我们最后一定要是要解决这个事情。</p>
<p>所以， 一个沟通可以从广义上分成三个阶段， 一沟通， 二做事； 三、沟通。第二次沟通是为了确认结果， 或者是同步结果。总而言之， 一个完整的沟通也会一次好的沟通结束。</p></div></main></body></html>
